name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate Prisma Client & Seed Database
        working-directory: ./frontend
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run seed
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build Static Export for Firebase Hosting
        working-directory: ./frontend
        run: npm run build:export
        env:
          DATABASE_URL: "file:./dev.db"
          NEXT_PUBLIC_APP_URL: "https://stayzy-83375.web.app"
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_DEFAULT_TIMEZONE: "Asia/Kolkata"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAjUnuYLvCGfYJEqQ7unkYxAmWbDrwhy6E"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "pg-rooms-60c83.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "pg-rooms-60c83"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "pg-rooms-60c83.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "27796929578"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:27796929578:web:c9018be5ea6e29db88d753"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-ZB2V2Z6VZ3"

      - name: Deploy to Firebase Hosting
        run: |
          if [ -n "${{ secrets.FIREBASE_TOKEN }}" ]; then
            npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project stayzy-83375 --non-interactive
          else
            echo "::error::FIREBASE_TOKEN is not set in GitHub Repository Secrets!"
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
